name: Deploy func-rota-proxima

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F0BEBD98698940F98707A0093084DD22 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A73994C036684D429EDFB705872BE170 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_560448AE5CA541299CC02FE7A31A1D2C }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'func-rota-proxima'
          package: './rota-proxima-teste'
          remote-build: true
